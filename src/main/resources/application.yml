server:
  port: 5215
spring:
  datasource:
    url: jdbc:h2:file:./data/sandbox;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
app:
  seed-on-empty: true
